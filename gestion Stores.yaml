blueprint:
  name: Gestion Avancée des Volets Roulants
  description: >
    Automatisation complète pour volets roulants basée sur le soleil,
    la température et le mode été/hiver. Permet le contrôle manuel
    et la désactivation temporaire.
  domain: automation
  input:
    cover_entity:
      name: Volet roulant
      description: L'entité du volet roulant à contrôler
      selector:
        entity:
          domain: cover
    temperature_indoor:
      name: Capteur de température intérieure
      description: Capteur de température intérieure
      selector:
        entity:
          domain: sensor
    temperature_outdoor:
      name: Capteur de température extérieure
      description: Capteur de température extérieure
      selector:
        entity:
          domain: sensor
    disable_automation:
      name: Désactiver l'automatisation
      description: Un interrupteur pour désactiver temporairement l'automatisation
      selector:
        entity:
          domain: input_boolean
    summer_mode:
      name: Mode été
      description: Activer le mode été (fermeture partielle en cas de chaleur)
      selector:
        entity:
          domain: input_boolean
    facade_orientation:
      name: Orientation de la façade
      description: Orientation en degrés (0=N, 90=E, 180=S, 270=O)
      default: 180
      selector:
        number:
          min: 0
          max: 359
          step: 1
          mode: slider
    morning_position:
      name: Position au lever du soleil
      description: Position du volet le matin (0-100%)
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    evening_position:
      name: Position au coucher du soleil
      description: Position du volet le soir (0-100%)
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    summer_position:
      name: Position en mode été
      description: Position en cas de chaleur/soleil direct (0-100%)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    temp_threshold_out:
      name: Seuil température extérieure
      description: Seuil pour activer la protection solaire
      default: 25
      selector:
        number:
          min: 15
          max: 40
          step: 0.5
          mode: box
    temp_threshold_in:
      name: Seuil température intérieure
      description: Seuil pour maintenir la fraîcheur
      default: 26
      selector:
        number:
          min: 18
          max: 40
          step: 0.5
          mode: box
    morning_offset:
      name: Décalage lever soleil
      description: En minutes (- = avant, + = après)
      default: 0
      selector:
        number:
          min: -120
          max: 120
          step: 5
          mode: box
    evening_offset:
      name: Décalage coucher soleil
      description: En minutes (- = avant, + = après)
      default: 0
      selector:
        number:
          min: -120
          max: 120
          step: 5
          mode: box

mode: restart
max_exceeded: silent

trigger:
  - platform: sun
    event: sunrise
    offset: !input morning_offset
    id: sunrise_trigger
  - platform: sun
    event: sunset
    offset: !input evening_offset
    id: sunset_trigger
  - platform: time_pattern
    minutes: "/15"
    id: periodic_check
  - platform: state
    entity_id: !input summer_mode
    id: mode_change
  - platform: state
    entity_id: !input disable_automation
    id: disable_change
  - platform: state
    entity_id: !input temperature_indoor
    id: temp_in_change
  - platform: state
    entity_id: !input temperature_outdoor
    id: temp_out_change

condition:
  - condition: state
    entity_id: !input disable_automation
    state: "off"

action:
  - choose:
      # Lever du soleil - Ouverture des volets le matin
      - conditions:
          - condition: trigger
            id: sunrise_trigger
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input morning_position
      
      # Coucher du soleil - Fermeture des volets le soir
      - conditions:
          - condition: trigger
            id: sunset_trigger
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input evening_position
      
      # Mode été avec soleil direct et chaleur
      - conditions:
          - condition: state
            entity_id: !input summer_mode
            state: "on"
          - condition: state
            entity_id: sun.sun
            state: "above_horizon"
          - condition: template
            value_template: >
              {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
              {% set fa = facade_orientation | float(180) %}
              {% set diff = (az - fa) | abs %}
              {% if diff > 180 %}
                {% set diff = 360 - diff %}
              {% endif %}
              {% set el = state_attr('sun.sun', 'elevation') | float(0) %}
              {{ is_state('sun.sun', 'above_horizon') and el > 0 and diff < 90 }}
          - condition: numeric_state
            entity_id: !input temperature_outdoor
            above: !input temp_threshold_out
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input summer_position
      
      # Température intérieure élevée - Protection
      - conditions:
          - condition: numeric_state
            entity_id: !input temperature_indoor
            above: !input temp_threshold_in
          - condition: numeric_state
            entity_id: !input temperature_outdoor
            above: !input temp_threshold_in
          - condition: state
            entity_id: sun.sun
            state: "above_horizon"
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input summer_position
